name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag bleibt bewusst fest auf :v2 — genau das Image, das der mittwald-Container
      # referenziert (siehe Studio -> Container -> Image). Ein anderer Tag würde
      # zusätzlich verlangen, die Image-Referenz im Container manuell umzustellen.
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/samuelmartens1707-svg/mzmedia:v2

      # Ruft den mittwald Pull-Image-Webhook für genau diesen Container auf (Studio ->
      # Container -> Image bearbeiten -> Webhook-URL). Das pullt das frisch gepushte
      # Image und recreated nur diesen Service, nicht die anderen Container im Stack.
      - name: Trigger mittwald pull & recreate
        run: curl -fsS "${{ secrets.MITTWALD_PULL_WEBHOOK_URL }}"
